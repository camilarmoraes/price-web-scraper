<!doctype html>
<html lang="pt-BR">
<body>
<main>
  <article data-testid="product-card">
    <a data-testid="product-card::card" href="/produto/iphone-15-pro-128gb/abc123/">
      <h2 data-testid="product-card::name">iPhone 15 Pro 128GB</h2>
    </a>
    <div data-testid="product-card::price">
      <strong>R$ 7.299,00</strong>
    </div>
    <div aria-label="Menor preço"><span>Magazine Luiza</span></div>
  </article>

  <article data-testid="product-card">
    <a data-testid="product-card::card" href="https://www.zoom.com.br/produto/galaxy-s24/xyz/">
      <h2 data-testid="product-card::name">Samsung Galaxy S24 256GB</h2>
    </a>
    <div data-testid="product-card::price">
      <strong>R$ 4.199,90</strong>
    </div>
    <div aria-label="Menor preço"><span>Amazon</span></div>
  </article>

  <article data-testid="product-card">
    <a data-testid="product-card::card" href="/produto/notebook/lmn/">
      <h2 data-testid="product-card::name">Notebook Dell Inspiron 15</h2>
    </a>
    <div data-testid="product-card::price">
      <strong>R$ 3.899,00</strong>
    </div>
    <div aria-label="Menor preço"><span>Casas Bahia</span></div>
  </article>
</main>
</body>
</html>
