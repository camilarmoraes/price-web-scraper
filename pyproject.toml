[project]
name = "price-crawler"
version = "0.1.0"
description = "Web scraper que consolida ofertas do Zoom e Buscapé numa base histórica local, com bypass de detecção anti-bot e dashboard interativo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Camila Ribeiro" }]
dependencies = [
    "playwright>=1.47",
    "beautifulsoup4>=4.12",
    "streamlit>=1.38",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_crawler"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
